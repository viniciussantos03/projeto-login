<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <section>
            <div id="imagem">
                <img src="imagens/metal.jpg" alt="imagem de metal">
            </div>
            <div id="formulario">
                <h1>Login</h1>
                <p class="tela">Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
                <form action="cadastro.php" method="post">
                    <p class="email">
                        <label for="iemail"><span class="material-symbols-outlined" id="material">person</span></label>
                        <input type="email" name="email" id="iemail" required placeholder="seu e-mail">
                    </p>
                    <p class="senha">
                        <label for="isen"><span class="material-symbols-outlined" id="material">key</span></label>
                        <input type="password" name="sen" id="isen" required placeholder="sua senha" minlength="8">
                    </p>
                    <p class="entrar">
                        <input type="submit" value="Entrar"> <br>
                    </p>

                    <p class="troca">
                        <a href="#">Esqueci a senha <span class="material-symbols-outlined">mail</span></a>
                    </p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
